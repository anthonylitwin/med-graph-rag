annotation_eval:
  # Keep this stable for a parameter set so DVC can identify the stage output.
  eval_id: fullgold-noninst-extractor-v2-acceptance-v001
  python: ..\.venv\Scripts\python.exe
  gold_manifest: 
    data/annotations/gold_v001/bootstrap_v001_full/gold_manifest.json
  gold_root: data/annotations/gold_v001/bootstrap_v001_full
  output_root: data/annotations/eval_v001

  # Safe default for validating the pipeline. Change to frontier, local-qwen25,
  # local-qwen3, local-gliner, or local-non-instruct for a model experiment.
  model_profile: local-non-instruct
  model: sentence-transformers/all-MiniLM-L6-v2
  entity_model: Ihor/gliner-biomed-small-v1.0
  min_confidence: 0.5
  limit:
  fail_fast: true

  non_instruct:
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    terminology_path: data/terminology/biomedical_aliases_v001.json
    entity_threshold: 0.5
    concept_threshold: 0.84
    relation_threshold: 0.62
    semantic_floor: 0.52
    semantic_weight: 0.5
    cue_weight: 0.25
    proximity_weight: 0.1
    entity_confidence_weight: 0.15
    max_pair_distance: 300

  # Evaluation remains artifact-only. Graph ingestion is a separate workflow.
  neo4j_load_mode: none

  mlflow:
    enabled: true
    tracking_uri: http://127.0.0.1:5000
    experiment: medgraphrag-annotation-eval-v001
    run_name: fullgold-noninst-extractor-v2-acceptance-v001
    log_artifacts: true

qa_eval:
  # Keep this stable for a parameter set so DVC can identify the stage output.
  eval_id: qa-retrieval-extractor-v2-graph-v001
  python: ..\.venv\Scripts\python.exe
  question_file: eval/questions/qa_gold_v002.json
  question_root: eval/questions
  output_root: data/qa/eval_v001

  # Record the graph/input provenance for graph-backed QA runs.
  graph_run_id: fullgold-noninst-extractor-v2-graph-v001
  graph_source: accepted Extractor V2 predictions from fullgold-noninst-extractor-v2-acceptance-v001

  # Retrieval-only gate for the accepted Extractor V2 graph load.
  model_profile: local-non-instruct
  answerer_provider: ollama
  model: qwen2.5:7b-instruct
  retriever: graph
  max_evidence: 12
  skip_answer: true
  limit:
  fail_fast: true

  llm_judge:
    enabled: false
    provider: openai
    model:

  mlflow:
    enabled: true
    tracking_uri: http://127.0.0.1:5000
    experiment: medgraphrag-qa-eval-v001
    run_name: qa-retrieval-extractor-v2-graph-v001
    log_artifacts: true
